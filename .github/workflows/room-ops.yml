name: Room Ops

# 房间操作：云函数触发，浏览器内执行（过 aTrust 零信任网关）
# inputs.op = JSON，例如：
#   {"action":"book","date":"2026-10-04","start":"14:00","end":"17:00","room":"543","memo":"小组研讨"}
#   {"action":"cancel","uuid":"xxx","name":"Room 543"}
#   {"action":"query","date":"2026-10-04"}
on:
  workflow_dispatch:
    inputs:
      op:
        description: 'Room operation JSON'
        required: true

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout 代码仓库
        uses: actions/checkout@v4

      - name: Clone 私有数据仓库
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/wutian-yu/butler-data.git data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright pypinyin
          playwright install chromium --with-deps

      - name: Run Room Op
        env:
          XJTLU_USERNAME: ${{ secrets.XJTLU_USERNAME }}
          XJTLU_PASSWORD: ${{ secrets.XJTLU_PASSWORD }}
          EBRIDGE_COOKIES: ${{ secrets.EBRIDGE_COOKIES }}
          XJTLU_COOKIES_FILE: ${{ github.workspace }}/data/xjtlu_cookies.json
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ROOM_OP: ${{ github.event.inputs.op }}
        run: python xjtlu_monitor.py
