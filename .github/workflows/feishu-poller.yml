name: Feishu Poller

on:
  schedule:
    # 兜底角色：Feishu Live 常驻轮询（~50 秒一轮）是第一处理人，本工作流每 5 分钟扫一次，
    # 300 秒年龄门槛保证 live 存活时它绝不抢消息；live 停摆/接力空档时接管，消息零丢失。
    # 同时承担：AMS/定时推送的冗余检查（live 停摆时退化为完整 5 分钟粒度管家）+ 每日心跳提交。
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feishu-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: Run butler gateway poll (兜底 + 定时推送)
        env:
          TZ: Asia/Shanghai
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_VERIFY_TOKEN: ${{ secrets.FEISHU_VERIFY_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # GH_PAT：仓库既有密钥（xjtlu-monitor 已用它经 Contents API 读写 butler-data，
          # 与网关 gh_read_json/gh_write_json 同一操作），无需新增 Secret
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python gateway_driver.py poll

      - name: Daily heartbeat commit
        # 每日一次心跳提交，防止 GitHub「仓库 60 天无提交自动禁用定时工作流」机制误伤
        run: |
          python3 - << 'PYEOF'
          import json, datetime
          try:
              state = json.load(open("poll-state.json"))
          except Exception:
              state = {}
          day = datetime.datetime.now().strftime("%Y-%m-%d")
          if state.get("heartbeat") == day:
              print("heartbeat already set today, no change")
          else:
              state["heartbeat"] = day
              json.dump(state, open("poll-state.json", "w"), ensure_ascii=False, indent=2)
          PYEOF
          if [ -z "$(git status --porcelain poll-state.json)" ]; then
            echo "heartbeat unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add poll-state.json
            git commit -m "chore: daily heartbeat [skip ci]"
            git push || echo "push conflict, skip"
          fi
