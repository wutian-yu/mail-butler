name: XJTLU Monitor

on:
  schedule:
    # 每30分钟运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码仓库
        uses: actions/checkout@v4

      - name: Clone 私有数据仓库
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/wutian-yu/butler-data.git data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run XJTLU Monitor
        env:
          XJTLU_USERNAME: ${{ secrets.XJTLU_USERNAME }}
          XJTLU_PASSWORD: ${{ secrets.XJTLU_PASSWORD }}
          EBRIDGE_COOKIES: ${{ secrets.EBRIDGE_COOKIES }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          XJTLU_STATE_FILE: ${{ github.workspace }}/data/xjtlu_state.json
        run: python xjtlu_monitor.py

      - name: Push 数据仓库变更
        run: |
          cd data
          git config user.name "XJTLU Monitor Bot"
          git config user.email "bot@xjtlu.edu.cn"
          git add .
          git diff --cached --quiet || (git commit -m "xjtlu state update" && git push -f)
