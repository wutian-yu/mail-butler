name: XJTLU Monitor

on:
  schedule:
    # 每30分钟运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码仓库
        uses: actions/checkout@v4

      - name: Clone 私有数据仓库
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/wutian-yu/butler-data.git data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run XJTLU Monitor
        env:
          XJTLU_USERNAME: ${{ secrets.XJTLU_USERNAME }}
          XJTLU_PASSWORD: ${{ secrets.XJTLU_PASSWORD }}
          EBRIDGE_COOKIES: ${{ secrets.EBRIDGE_COOKIES }}
          XJTLU_COOKIES_FILE: ${{ github.workspace }}/data/xjtlu_cookies.json
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          XJTLU_STATE_FILE: ${{ github.workspace }}/data/xjtlu_state.json
        run: python xjtlu_monitor.py

      - name: Push 数据仓库变更
        run: |
          cd data
          git config user.name "XJTLU Monitor Bot"
          git config user.email "bot@xjtlu.edu.cn"
          git add .
          # v41 修复：原 git push -f 会把 clone 之后云函数/管家写入的全部提交强制抹掉
          # （曾导致 finance.json 账本、消息去重记录等无端丢失）。
          # 改为 rebase 远端新提交后再推；冲突则放弃本次（下次运行自然同步），绝不覆盖远端。
          git diff --cached --quiet || (git commit -m "xjtlu state update" && (git pull --rebase origin main && git push || (git rebase --abort 2>/dev/null; echo "push skipped: rebase conflict, next run will retry")))
